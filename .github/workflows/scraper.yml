name: Scraper FC Barcelona → Firestore

# Evitar que se ejecuten dos bots a la vez. cancel-in-progress: true evita que
# un run anterior (que puede quedarse horas en el bucle de seguimiento en vivo)
# bloquee/descarte los siguientes ticks del cron: el run nuevo cancela al viejo
# y retoma el seguimiento del partido en vivo al instante.
concurrency:
  group: scraper-live-tracking
  cancel-in-progress: true

on:
  schedule:
    # GitHub Actions puede retrasar o directamente perder eventos "schedule"
    # bajo carga (documentado por GitHub, no es un bug de este repo): con solo
    # 5 horarios fijos al día, el historial real mostraba que únicamente 2 de
    # los 5 llegaban a dispararse, con retrasos de 30min a ~2h. La mitigación
    # es lanzarlo mucho más a menudo (cada 15 min, ~96 veces/día) para que,
    # aunque GitHub siga perdiendo eventos, casi siempre haya alguno cerca de
    # cada horario relevante. Cada tick "vacío" (sin partido próximo/en vivo)
    # cuesta segundos porque el script sale enseguida (ver main.py). Se evitan
    # los minutos :00/:15/:30/:45 (los de mayor carga en GitHub) con offset +4.
    - cron: '4,19,34,49 * * * *'

  # Permitir ejecución manual desde GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ejecutar en modo dry-run (no escribe en Firestore)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      source:
        description: 'Fuente de datos'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'espn'
          - 'marca'

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    # Límite de seguridad: cubre el peor caso (espera pre-partido de hasta
    # ~2.1h + partido con prórroga/penaltis + margen) sin dejar el job colgado
    # indefinidamente si algo se atasca.
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: 🔑 Reconstruir credenciales de Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY_BASE64" | base64 --decode > serviceAccountKey.json
          echo "✅ serviceAccountKey.json reconstruido desde secreto"

      - name: 🤖 Ejecutar scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ''  # No necesario, usamos el archivo
        run: |
          DRY_RUN_FLAG=""
          SOURCE_FLAG=""

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          if [ -n "${{ github.event.inputs.source }}" ]; then
            SOURCE_FLAG="--source ${{ github.event.inputs.source }}"
          fi

          python -m scraper.main $DRY_RUN_FLAG $SOURCE_FLAG

      - name: 🧹 Limpiar credenciales
        if: always()
        run: rm -f serviceAccountKey.json
